    <h4>${esc(p.name)} <span class="badge" style="background:${p.kind==='user'?'#fbe9e9':p.kind==='rec'?'#e6f4ec':'#eef0f2'};color:${p.kind==='user'?'#d64545':p.kind==='rec'?'#2e8b57':'#59616b'}">${p.kind==='user'?'직접 선택':p.kind==='rec'?'추천':'교통 허브'}</span></h4>
    <div class="cat">${esc(p.cat)} · ${esc(p.addr)}</div>
    ${p.hours?`<div class="kv"><b>운영</b> ${esc(p.hours)}</div>`:''}
    ${p.fee?`<div class="kv"><b>요금</b> ${esc(p.fee)}</div>`:''}
    <div class="kv">${p.desc}</div>
    <div style="margin-top:4px">${days}</div>
    <div class="links">${links}</div>
  </div>`;
}

/* ---------- leaflet ---------- */
function makeIcon(p){
  return L.divIcon({className:'', html:`<div class="pin ${pinKind(p)}" data-pid="${p.id}" data-lat="${p.lat}" data-lon="${p.lon}" data-kind="${p.kind}">${p.no||''}</div>`, iconSize:[26,26], iconAnchor:[13,13]});
}
function bearing(a,b){
  const toRad=d=>d*Math.PI/180, toDeg=r=>r*180/Math.PI;
  const y=Math.sin(toRad(b[1]-a[1]))*Math.cos(toRad(b[0]));
  const x=Math.cos(toRad(a[0]))*Math.sin(toRad(b[0]))-Math.sin(toRad(a[0]))*Math.cos(toRad(b[0]))*Math.cos(toRad(b[1]-a[1]));
  return (toDeg(Math.atan2(y,x))+360)%360;
}
function buildRoutes(){
  for(const d of [1,2,3]){
    const stops = DATA.itinerary.find(i=>i.day===d).stops;
    const pts = stops.map(s=>{const p=placeById(s.id);return [p.lat,p.lon];});
    const line = L.polyline(pts,{color:DAYC[d],weight:3.5,opacity:.85,dashArray:'2 7',lineCap:'round'}).addTo(map);
    routeLayers[d]=line;
    for(let i=0;i<pts.length-1;i++){
      const mid=[(pts[i][0]+pts[i+1][0])/2,(pts[i][1]+pts[i+1][1])/2];
      const br=bearing(pts[i],pts[i+1]);
      const ic=L.divIcon({className:'arrow', html:`<div style="transform:rotate(${br-90}deg);color:${DAYC[d]};font-size:15px">▶</div>`, iconSize:[14,14], iconAnchor:[7,7]});
      arrowLayer.push(L.marker(mid,{icon:ic,interactive:false}).addTo(map));
    }
  }
}
function refreshVisibility(){
  // pins
  pinLayer.forEach(({p,m})=>{
    const vis = (state.day==='all'||p.days.includes(+state.day)) &&
      (p.kind!=='rec'||state.recs);
    if(!vis){map.removeLayer(m);return;}
    if(!map.hasLayer(m))m.addTo(map);
    m.setIcon(makeIcon(p));
  });
  // routes
  for(const d of [1,2,3]){
    const vis = state.day==='all'||+state.day===d;
    if(routeLayers[d]){ if(vis&&!map.hasLayer(routeLayers[d]))routeLayers[d].addTo(map); if(!vis&&map.hasLayer(routeLayers[d]))map.removeLayer(routeLayers[d]); }
  }
  arrowLayer.forEach(a=>{ // arrows tagged by day via color — recompute visibility by matching route pts
    const vis = state.day==='all'||a._day===+state.day;
    if(vis&&!map.hasLayer(a))a.addTo(map); if(!vis&&map.hasLayer(a))map.removeLayer(a);
  });
  // itinerary highlight
  $$('.daycard').forEach(el=>{el.style.display=(state.day==='all'||el.dataset.day===state.day)?'':'none';});
  $$('#recbox').forEach(el=>{el.style.display=state.recs?'':'none';});
  $$('#recs .stop').forEach(el=>{
    const visible=state.day==='all'||el.dataset.days.split(',').includes(state.day);
    el.style.display=visible?'':'none';
  });
  // schematic
  if(state.schematic)buildSchematic();
}
function fitAll(){
  const places=DATA.places.filter(p=>(p.kind!=='rec'||state.recs)&&(state.day==='all'||p.days.includes(+state.day)));
  const pts=places.map(p=>[p.lat,p.lon]);
  if(pts.length)map.fitBounds(L.latLngBounds(pts).pad(state.day==='all'?0.12:0.18),{animate:false});
}

/* ---------- schematic (offline) ---------- */
function project(lat,lon,bbox,W,H){
  const [s,w,n,e]=bbox; const x=(lon-w)/(e-w)*W, y=(n-lat)/(n-s)*H;
  return [x,y];
}
function buildSchematic(){
  const svg=$('#scSvg'); const wrap=$('#mapwrap');
  const W=Math.max(wrap.clientWidth,320), H=Math.max(wrap.clientHeight,300);
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const visiblePlaces=DATA.places.filter(p=>(p.kind!=='rec'||state.recs)&&(state.day==='all'||p.days.includes(+state.day)));
  const lats=visiblePlaces.map(p=>p.lat), lons=visiblePlaces.map(p=>p.lon);
  const pad=state.day==='all'?0.02:0.005;
  const bbox=[Math.min(...lats)-pad,Math.min(...lons)-pad,Math.max(...lats)+pad,Math.max(...lons)+pad];
  let inner='';
  // grid
  for(let i=1;i<8;i++) inner+=`<line x1="0" y1="${H*i/8}" x2="${W}" y2="${H*i/8}" stroke="#dfe3e7" stroke-width="1"/><line x1="${W*i/8}" y1="0" x2="${W*i/8}" y2="${H}" stroke="#dfe3e7" stroke-width="1"/>`;
  // routes
  for(const d of [1,2,3]){
    if(state.day!=='all'&&+state.day!==d)continue;
    const stops=DATA.itinerary.find(i=>i.day===d).stops;
    const pts=stops.map(s=>{const p=placeById(s.id);return project(p.lat,p.lon,bbox,W,H);});
    const dstr=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' ');
    inner+=`<path d="${dstr}" fill="none" stroke="${DAYC[d]}" stroke-width="3" stroke-dasharray="3 6" stroke-linecap="round" opacity=".8"/>`;
    for(let i=0;i<pts.length-1;i++){
      const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;
      const ang=Math.atan2(pts[i+1][1]-pts[i][1],pts[i+1][0]-pts[i][0])*180/Math.PI;
      inner+=`<g transform="translate(${mx},${my}) rotate(${ang})"><path d="M-4,-5 L5,0 L-4,5 Z" fill="${DAYC[d]}"/></g>`;
    }
  }
  // labels for a few landmarks
  inner+=`<text x="12" y="20" font-size="11" fill="#8a8f94">개략도 모드 · 비율=직선거리 비례 · 바다/도로 생략</text>`;
  svg.innerHTML=inner;
  // pins as DOM
  $('#schematic').querySelectorAll('.sc-pin').forEach(n=>{n.remove();});
  scPins=[];
  DATA.places.forEach(p=>{
    if(p.kind==='rec'&&!state.recs)return;
    if(state.day!=='all'&&!p.days.includes(+state.day))return;
    const [x,y]=project(p.lat,p.lon,bbox,W,H);
    const el=document.createElement('div');
    el.className='sc-pin '+pinKind(p);
    el.textContent=p.no||''; el.style.left=x+'px'; el.style.top=y+'px';
    el.dataset.pid=p.id;el.dataset.lat=String(p.lat);el.dataset.lon=String(p.lon);
    el.onclick=ev=>{ev.stopPropagation();showScTip(p,x,y);};
    $('#schematic').appendChild(el); scPins.push(el);
  });
}
function showScTip(p,x,y){
  const t=$('#sc-tip');
  t.innerHTML=popupHTML(p);
  t.style.display='block';
  const wrap=$('#mapwrap');
  t.style.left=Math.min(x+16,wrap.clientWidth-280)+'px';
  t.style.top=Math.max(8,y-10)+'px';
}

/* ---------- itinerary panel ---------- */
function buildPanel(){
  $('#assump').innerHTML=`<b>기본 가정 (조정 가능)</b><br>${DATA.meta.assumptions.map(a=>'· '+a).join('<br>')}`;
  const daysEl=$('#days');
  daysEl.innerHTML=DATA.itinerary.map(day=>`
    <div class="daycard" data-day="${day.day}">
      <div class="dhead"><span class="chip" style="background:${DAYC[day.day]}"></span>${esc(day.title)}<span class="meta">${esc(day.meta)}</span></div>
      ${day.stops.map((s,i)=>{
        const p=placeById(s.id);
        const leg=day.legs?.[i-1];
        return `${leg?`<div class="leg"><span class="bar"></span>${esc(leg.mode)} 약 ${leg.min}분${leg.tag?` · <span class="tag">${esc(leg.tag)}</span>`:''}</div>`:''}
        <div class="stop" data-pid="${p.id}" data-day="${day.day}" role="button" tabindex="0" aria-label="${esc(p.name)} ${esc(s.time||'')}">
          <div class="num" style="background:${p.kind==='user'?'var(--user-red)':p.kind==='rec'?'var(--rec-green)':'#6b7280'}">${i+1}</div>
          <div class="body">
            <div class="nm">${esc(p.name)}<span class="kind ${p.kind==='user'?'u':p.kind==='rec'?'r':'h'}">${p.kind==='user'?'직접 선택':p.kind==='rec'?'추천':'교통 허브'}</span></div>
            <div class="tm">${esc(s.time||'')}</div>
            ${s.note?`<div class="note">${esc(s.note)}</div>`:''}
          </div>
        </div>`;
      }).join('')}
    </div>`).join('');
  $('#recs').innerHTML=DATA.places.filter(p=>p.kind==='rec').map(p=>`
    <div class="stop" data-pid="${p.id}" data-days="${p.days.join(',')}">
      <div class="num" style="background:var(--rec-green)">${p.no||''}</div>
      <div class="body"><div class="nm">${esc(p.name)}</div>
      <div class="tm">${esc(p.hours||'')}</div>
      <div class="note">${esc(p.desc).slice(0,90)}…</div></div>
    </div>`).join('');
  $('#cautions').innerHTML=DATA.meta.cautions.map(c=>'· '+c).join('<br>');
  $('#srclist').innerHTML=DATA.meta.sources.map(s=>`<li><a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.t)}</a></li>`).join('');
  $$('.stop').forEach(el=>{
    el.onclick=event=>{event.stopPropagation();selectPlace(el.dataset.pid,el);};
    el.onkeydown=event=>{
      if(event.key==='Enter'||event.key===' '){event.preventDefault();selectPlace(el.dataset.pid,el);}
    };
  });
}
function selectPlace(id,row){
  const p=placeById(id); if(!p)return;
  $$('.stop.sel').forEach(e=>{e.classList.remove('sel');});
  if(row)row.classList.add('sel');
  if(row)row.scrollIntoView({block:'nearest',behavior:'smooth'});
  if(state.schematic){
    const el=scPins.find(n=>n.dataset.pid===p.id);
    if(el){showScTip(p,parseFloat(el.style.left),parseFloat(el.style.top));}
    return;
  }
  if(!map)return;
  const ent=pinLayer.find(e=>e.p.id===id);
  if(ent){ent.m.openPopup();
    const node=ent.m.getElement()?.querySelector('.pin'); if(node){node.classList.remove('pulse');void node.offsetWidth;node.classList.add('pulse');}}
  map.setView([p.lat,p.lon],Math.max(map.getZoom(),15),{animate:false});
}

/* ---------- boot ---------- */
function banner(msg){const b=$('#banner');b.innerHTML=msg;b.style.display=msg?'block':'none';}
function setSchematic(on,reason){
  state.schematic=on;
  $('#schematic').style.display=on?'block':'none';
  $('#map').style.visibility=on?'hidden':'visible';
  $('#viewToggle').textContent=on?'지도 보기':'개략도 보기';
  if(on){buildSchematic();banner(reason||'');}
  else banner('');
}
function boot(){
  buildPanel();
  // leaflet load guard
  let waited=0;
  const iv=setInterval(()=>{
    waited+=200;
    if(window.L){clearInterval(iv);state.leafletReady=true;initMap();}
    else if(waited>8000){clearInterval(iv);setSchematic(true,'지도 라이브러리를 불러오지 못했습니다(오프라인일 수 있음). 개략도 모드로 표시합니다.');}
  },200);
}
function initMap(){
  map=L.map('map',{zoomControl:true}).setView([35.85,129.22],12);
  window.__mapMoveCount=0;
  map.on('moveend',()=>{window.__mapMoveCount++;window.dispatchEvent(new Event('gyeongju-map-idle'));});
  const tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19,attribution:'© OpenStreetMap contributors'
  }).addTo(map);
  let tileErr=0;
  tiles.on('tileerror',()=>{tileErr++;window.__mapTileState.errors++;window.dispatchEvent(new Event('gyeongju-map-tile')); if(tileErr>3&&!state.tileFailed){state.tileFailed=true;
    banner('지도 타일을 불러오지 못하고 있습니다(네트워크 필요). 핀과 동선은 유지되며, 개략도 모드로 전환할 수 있습니다.');}});
  tiles.on('tileload',()=>{window.__mapTileState.loads++;window.dispatchEvent(new Event('gyeongju-map-tile'));});
  DATA.places.forEach(p=>{
    const m=L.marker([p.lat,p.lon],{icon:makeIcon(p)}).addTo(map);
    m.bindPopup(popupHTML(p),{maxWidth:280});
    m.on('popupopen',()=>window.dispatchEvent(new Event('gyeongju-map-popup-open')));
    m.on('click',()=>{
      const row=$(`.daycard[data-day="${state.day==='all'?p.days[0]:state.day}"] .stop[data-pid="${p.id}"]`) ||
        $(`.recbox .stop[data-pid="${p.id}"]`);
      if(row){$$('.stop.sel').forEach(e=>{e.classList.remove('sel');});row.classList.add('sel');}
    });
    pinLayer.push({p,m});
  });
  buildRoutes();
  // tag arrows with day
  let ai=0;
  for(const d of [1,2,3]){
    const n=DATA.itinerary.find(i=>i.day===d).stops.length-1;
    for(let k=0;k<n;k++){arrowLayer[ai++]._day=d;}
  }
  fitAll();
  window.dispatchEvent(new Event('gyeongju-map-ready'));
}
/* ---------- controls ---------- */
$('#dayPills').addEventListener('click',e=>{
  const b=e.target.closest('.pill');if(!b)return;
  $$('#dayPills .pill').forEach(x=>{x.classList.toggle('active',x===b);});
  $$('#dayPills .pill').forEach(x=>{x.setAttribute('aria-pressed',String(x===b));});
  state.day=b.dataset.day;
  $('#fitBtn').textContent=state.day==='all'?'전체 보기':'이 날 보기';
  refreshVisibility();
  if(map&&!state.schematic)fitAll();
});
$('#recToggle').addEventListener('click',()=>{
  state.recs=!state.recs;
  $('#recToggle').classList.toggle('off',!state.recs);
  $('#recToggle').setAttribute('aria-pressed',String(state.recs));
  refreshVisibility();
});
$('#fitBtn').addEventListener('click',()=>{
  if(state.schematic){buildSchematic();$('#sc-tip').style.display='none';return;}
  if(map)fitAll();
});
$('#viewToggle').addEventListener('click',()=>setSchematic(!state.schematic,state.schematic?'':'개략도 모드'));
document.addEventListener('click',e=>{if(!e.target.closest('#sc-tip')&&!e.target.closest('.sc-pin'))$('#sc-tip').style.display='none';});
window.addEventListener('resize',()=>{if(state.schematic)buildSchematic();});
document.addEventListener('DOMContentLoaded',()=>{ if(!DATA){document.body.innerHTML='<p style="padding:40px">데이터 없음</p>';return;} if(matchMedia('(max-width: 1023px)').matches)$('#legend').removeAttribute('open');boot(); });
</script>
</body>
